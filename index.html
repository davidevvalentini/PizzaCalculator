<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcolapizza</title>
<meta name="description" content="Calcolatore di impasti per pizza · Pizza dough calculator">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f1f4f0; --surface:#ffffff; --ink:#16241c; --muted:#5d6e64; --line:#d9e0da;
  --basil:#1d6a44; --basil-soft:#dcece3; --on-basil:#ffffff; --ember:#d9531e; --ember-ink:#b23f10; --ember-soft:#fbe9e0;
  --flour:#c9a24a; --water:#3d82a8; --salt:#7c8a93; --oil:#8aa02f; --old:#9a6b4f;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101813; --surface:#18221c; --ink:#e8efe9; --muted:#93a59a; --line:#2a3830;
    --basil:#59c48c; --basil-soft:#1f3328; --on-basil:#0d1a12; --ember:#ff8a55; --ember-ink:#ff9a6c; --ember-soft:#3a2418;
    --flour:#dcb95f; --water:#6bb3d8; --salt:#9aa9b2; --oil:#b4cc52; --old:#c8957a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101813; --surface:#18221c; --ink:#e8efe9; --muted:#93a59a; --line:#2a3830;
  --basil:#59c48c; --basil-soft:#1f3328; --on-basil:#0d1a12; --ember:#ff8a55; --ember-ink:#ff9a6c; --ember-soft:#3a2418;
  --flour:#dcb95f; --water:#6bb3d8; --salt:#9aa9b2; --oil:#b4cc52; --old:#c8957a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;font-size:inherit}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,5vw,30px);letter-spacing:-.02em;margin:0}
.tools{display:flex;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;padding:9px 14px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--basil);color:var(--on-basil)}
.btn{font-weight:600;border-radius:10px;padding:11px 18px;border:1px solid var(--basil);background:var(--basil);color:var(--on-basil);cursor:pointer}
.btn.ghost{background:transparent;color:var(--basil)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}

/* wizard */
.wizard{max-width:560px;margin:8px auto 0;width:100%;display:flex;flex-direction:column;gap:18px}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--basil)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wizard h2{font-size:clamp(28px,6vw,36px);line-height:1.1;letter-spacing:-.02em}
.wizard .lead{color:var(--muted);margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);min-height:44px}
.opt b{font-size:16px}
.opt span{color:var(--muted);font-size:13.5px}
.opt[aria-pressed="true"]{background:var(--basil-soft);border:2px solid var(--basil);padding:15px}
.opt[aria-pressed="true"] b{color:var(--basil)}
.opt[aria-pressed="true"] span{color:var(--ink)}
.navrow{display:flex;gap:10px;margin-top:6px}
.navrow .btn:last-child{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card h3{font-size:17px;margin-bottom:6px}

/* fields */
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:9px 0}
.field+.field{border-top:1px solid var(--line)}
.field label{font-weight:500}
.field small{grid-column:1;color:var(--muted);font-size:12.5px;line-height:1.35}
.num{display:flex;align-items:center;gap:6px;grid-column:2;grid-row:1 / span 2}
.num input{width:72px;font:500 16px var(--font-mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:right;min-height:40px}
.num em{font-style:normal;color:var(--muted);font-size:13px;min-width:24px}
.field input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--basil);margin:6px 0 2px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer}
.step input{width:90px;font:500 22px var(--font-mono);text-align:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:44px}
.step em{font-style:normal;color:var(--muted);width:24px}
.qrow{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.qrow>label{font-weight:500}
.switch{display:flex;align-items:center;gap:12px;padding:12px 0 6px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--basil);flex:none}
.switch b{display:block;font-weight:600}
.switch span{display:block;color:var(--muted);font-size:12.5px}
.segfull{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.segfull button{flex:1;padding:10px 6px;background:var(--bg);color:var(--muted);border:0;border-left:1px solid var(--line);font-weight:500;cursor:pointer}
.segfull button:first-child{border-left:0}
.segfull button[aria-pressed="true"]{background:var(--basil);color:var(--on-basil)}

/* app */
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.pills .eyebrow{margin-right:4px}
.pill{background:var(--bg);padding:5px 12px;border-radius:999px;font-size:14px}
.pill.main{background:var(--basil-soft);color:var(--basil);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;min-width:0}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)} .cards{order:2} }
@media (max-width:560px){.cards{grid-template-columns:minmax(0,1fr)}}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:16px;min-width:0}
@media (max-width:900px){.bench{position:static;order:1}}
.bench h2{font-size:20px}
.bench h3{font-size:17px}
.sum{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--muted);font-size:14px}
.sum b{font:500 15px var(--font-mono);color:var(--ink)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:3px;align-self:center}
.ing .nm{font-weight:500}
.ing .sub{grid-column:2;color:var(--muted);font-size:12.5px}
.ing .g{grid-column:3;grid-row:1 / span 2;font:500 24px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ing .g i{font-style:normal;font-size:13px;color:var(--muted);margin-left:3px}
.ing li.yeast .g{color:var(--ember-ink)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg);gap:2px}
.stack div{min-width:3px}
.time{display:flex;flex-direction:column;gap:8px}
.tl{display:flex;height:30px;border-radius:8px;overflow:hidden;font:500 12px var(--font-mono)}
.tl div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 6px;color:#fff}
.tl .r{background:#c4471a}
.tl .f{background:#2f6f94}
.time p,.note{margin:0;color:var(--muted);font-size:13px}
.alt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.alt div{background:var(--bg);border-radius:10px;padding:10px 12px}
.alt span{display:block;color:var(--muted);font-size:12px}
.alt b{font:500 16px var(--font-mono)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.foot{margin:6px 0 0;color:var(--muted);font-size:12.5px;text-align:center}
.foot a{color:var(--basil)}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="brand">Calcolapizza</h1>
    <div class="tools">
      <button class="btn ghost" id="restart" hidden></button>
      <div class="seg" role="group" aria-label="Language">
        <button id="l_it" aria-pressed="true">IT</button>
        <button id="l_en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
  <main id="root"></main>
  <p class="foot" id="foot"></p>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
